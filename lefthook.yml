pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,json,md,css,yaml,yml}'
      run: pnpm exec prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx,js}'
      run: pnpm exec eslint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
